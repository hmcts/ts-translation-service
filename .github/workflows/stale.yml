name: Test Renovate config

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  renovate-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Renovate in dry-run mode
        uses: renovatebot/github-action@v46.3.7
        with:
          configurationFile: .github/renovate.json
          token: ${{ github.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: full
          RENOVATE_FORCE: '{"schedule": null}'
          LOG_LEVEL: debug
