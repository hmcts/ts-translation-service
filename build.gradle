import com.github.benmanes.gradle.versions.updates.DependencyUpdatesTask
import com.github.benmanes.gradle.versions.updates.resolutionstrategy.ComponentFilter
import com.github.benmanes.gradle.versions.updates.resolutionstrategy.ComponentSelectionWithCurrent
import uk.gov.hmcts.rse.AuthMode

plugins {
  id 'application'
  id 'idea'
  id 'jacoco'
  id 'io.github.ben-manes.versions' version '0.64.0'
  id 'com.github.hmcts.rse-cft-lib' version '0.19.2521'
  id 'com.github.spacialcircumstances.gradle-cucumber-reporting' version '0.1.25'
  id 'io.freefair.lombok' version '9.8.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.owasp.dependencycheck' version '13.0.0'
  id 'org.sonarqube' version '7.5.0.8588'
  id 'org.springframework.boot' version '4.1.2'
  id 'uk.gov.hmcts.java' version '0.12.70'
}

group = 'uk.gov.hmcts.reform'
version = '0.0.1'

ext {
  set('springCloudVersion', '2025.1.4')
  set('snakeyaml.version', '2.6')
  appInsightsVersion  = '2.6.4'
  jjwt               = '0.13.0'
  lombok              = '1.18.48'
  testcontainers      = '1.21.4'

}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

sourceSets {
  functionalTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/functionalTest/java')
    }
    resources.srcDir file('src/functionalTest/resources')
  }

  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/integrationTest/java')
    }
    resources.srcDir file('src/integrationTest/resources')
  }
}

configurations {
  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom runtimeOnly

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly

  cftlibRuntimeClasspath.extendsFrom(runtimeClasspath)
}

idea {
  module {
    // config to allow Intellij to mark test source and resource files correctly to help linting tools
    testSources.from(fileTree(dir: 'src/functionalTest/java'))
    testSources.from(fileTree(dir: 'src/integrationTest/java'))
    testResources.from(fileTree(dir: 'src/functionalTest/resources'))
    testResources.from(fileTree(dir: 'src/integrationTest/resources'))
  }
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

checkstyle {
  toolVersion = '14.3.0'
}

tasks.withType(Checkstyle).configureEach {
  exclude '**/package-info.java'
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()

  testLogging {
    exceptionFormat = 'full'
  }
}

test {
  failFast = true
}

tasks.register('smoke', JavaExec) {
  description = "Runs smoke tests"
  group = "Verification"

  generateCucumberReports.enabled = false
  mainClass = "uk.gov.hmcts.reform.translate.TranslationServiceBeftaMain"
  classpath += sourceSets.functionalTest.runtimeClasspath + sourceSets.main.output + sourceSets.test.output
  args = [
    '--threads', '10',
    '--plugin', "json:${rootDir}/target/cucumber.json",
    '--plugin', "junit:${layout.buildDirectory.file('test-results/smoke/cucumber.xml').get().asFile.absolutePath}",
    '--tags', '@Smoke and not @Ignore',
    '--glue', 'uk.gov.hmcts.befta.player', 'src/functionalTest/resources/features'
  ]
  // '--add-opens=...' added to suppress 'WARNING: An illegal reflective access operation has occurred' in uk.gov.hmcts.befta.util.CucumberStepAnnotationUtils
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']

  finalizedBy {
    generateCucumberReports.enabled = true
    generateCucumberReports {
      doLast {
        delete "${rootDir}/BEFTA Report for Smoke Tests/"
        new File("${rootDir}/BEFTA Report for Smoke Tests").mkdirs()
        file("${rootDir}/target/cucumber/cucumber-html-reports").renameTo(file("${rootDir}/BEFTA Report for Smoke Tests"))

        logger.quiet("Smoke test report moved to ---> file://${rootDir}/BEFTA%20Report%20for%20Smoke%20Tests/overview-features.html")
      }
    }
  }

  outputs.upToDateWhen { false }
}

tasks.register('functional', JavaExec) {
  description = "Runs functional tests"
  group = "Verification"

  generateCucumberReports.enabled = false
  mainClass = "uk.gov.hmcts.reform.translate.TranslationServiceBeftaMain"
  classpath += sourceSets.functionalTest.runtimeClasspath + sourceSets.main.output + sourceSets.test.output
  args = [
    '--threads', '10',
    '--plugin', "json:${rootDir}/target/cucumber.json",
    '--plugin', "junit:${layout.buildDirectory.file('test-results/functional/cucumber.xml').get().asFile.absolutePath}",
    '--tags', 'not @Ignore',
    '--glue', 'uk.gov.hmcts.befta.player', 'src/functionalTest/resources/features'
  ]
  // '--add-opens=...' added to suppress 'WARNING: An illegal reflective access operation has occurred' in uk.gov.hmcts.befta.util.CucumberStepAnnotationUtils
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']

  finalizedBy {
    generateCucumberReports.enabled = true
    generateCucumberReports {
      doLast {
        delete "${rootDir}/BEFTA Report for Functional Tests/"
        new File("${rootDir}/BEFTA Report for Functional Tests").mkdirs()
        file("${rootDir}/target/cucumber/cucumber-html-reports").renameTo(file("${rootDir}/BEFTA Report for Functional Tests"))
        logger.quiet("Functional test report moved to ---> file://${rootDir}/BEFTA%20Report%20for%20Functional%20Tests/overview-features.html")
      }
    }
  }

  outputs.upToDateWhen { false }
}

tasks.register('integration', Test) {
  description = "Runs integration tests"
  group = "Verification"
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  failFast = true
}

cucumberReports {
  testTasksFinalizedByReport = false
  outputDir = file("${rootDir}/target/cucumber")
  reports = files("${rootDir}/target/cucumber.json")
}

tasks.register('customCleanBeftaReports', Delete) {
  delete "${rootDir}/BEFTA Report for Smoke Tests/"
  delete "${rootDir}/BEFTA Report for Functional Tests/"
  delete "${rootDir}/target/cucumber"
  delete "${rootDir}/target/cucumber.json"
}
tasks.clean.dependsOn(tasks.customCleanBeftaReports)

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.required = true
    csv.required = false
    xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
  }
}

dependencies {

  // start::CVE Vulnerability dependency overrides                                                            // MAIN PARENT DEPENDEDNCY

  // PUT CVE Vulnerability dependency overrides here
  // e.g. implementation "com.example:example-lib:1.2.3'

  // end::CVE Vulnerability dependency overrides                                                              // MAIN PARENT DEPENDEDNCY



  // SPRING
  implementation "org.springframework.boot:spring-boot"
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-aspectj"
  implementation "org.springframework.boot:spring-boot-starter-json"
  implementation "org.springframework.boot:spring-boot-starter-data-jpa"
  implementation "org.springframework.boot:spring-boot-starter-cache"
  implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
  implementation "org.springframework.cloud:spring-cloud-config-server"
  implementation "org.springframework.cloud:spring-cloud-starter-config"
  implementation "org.springframework.cloud:spring-cloud-config-client"
  implementation "org.springframework.cloud:spring-cloud-starter-openfeign"
  implementation "org.springframework.security:spring-security-web"
  implementation "org.springframework.security:spring-security-oauth2-jose"
  implementation "org.springframework.security:spring-security-config"
  implementation "org.springframework.retry:spring-retry"
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1"

  // HMCTS
  implementation "com.github.hmcts:service-auth-provider-java-client:6.1.2"
  implementation "com.github.hmcts:idam-java-client:4.0.0"
  implementation "com.github.hmcts.java-logging:logging:8.0.0"

  implementation "com.auth0:java-jwt:4.6.1"
  implementation "com.microsoft.azure:applicationinsights-logging-logback:${appInsightsVersion}"
  implementation "com.microsoft.azure:applicationinsights-spring-boot-starter:${appInsightsVersion}"
  implementation "org.springframework.boot:spring-boot-starter-flyway"
  runtimeOnly "org.flywaydb:flyway-database-postgresql"
  implementation "org.postgresql:postgresql:42.7.13"

  testImplementation "org.springframework.boot:spring-boot-starter-test"
  testImplementation "org.assertj:assertj-vavr:0.5.1"
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"

  integrationTestImplementation sourceSets.main.runtimeClasspath
  integrationTestImplementation sourceSets.test.runtimeClasspath
  integrationTestImplementation "com.github.ben-manes.caffeine:caffeine:3.3.1"
  integrationTestImplementation "io.jsonwebtoken:jjwt-api:${jjwt}"
  integrationTestRuntimeOnly "io.jsonwebtoken:jjwt-impl:${jjwt}"
  integrationTestRuntimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwt}"
  integrationTestImplementation "com.pivovarit:throwing-function:1.6.1"
  integrationTestImplementation "org.wiremock.integrations:wiremock-spring-boot:4.4.2"
  integrationTestImplementation "org.testcontainers:postgresql:${testcontainers}"

  functionalTestImplementation sourceSets.main.runtimeClasspath
  functionalTestImplementation sourceSets.test.runtimeClasspath
  functionalTestImplementation "io.rest-assured:rest-assured:6.0.1"
  functionalTestImplementation "com.github.hmcts:befta-fw:9.2.11"
  functionalTestImplementation "com.github.hmcts:ccd-test-definitions:7.26.12"

  cftlibImplementation "org.springframework.boot:spring-boot-devtools"

}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

tasks.named('sonarqube') {
  dependsOn(tasks.named('jacocoTestReport'))
}
tasks.named('check') {
  dependsOn(tasks.named('integration'))
}

sonarqube {
  properties {
    property "sonar.projectName", "Reform :: ts-translation-service"
    property "sonar.projectKey", "uk.gov.hmcts.reform:ts-translation-service"
    property "sonar.coverage.jacoco.xmlReportPaths", "${jacocoTestReport.reports.xml.outputLocation}"
    property "sonar.exclusions",
      "src/main/java/uk/gov/hmcts/reform/translate/Application.java," +
        "src/main/java/uk/gov/hmcts/reform/translate/config/SecurityConfiguration.java"
  }
}

static boolean isNonStable(String version) {
  def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
  def regex = /^[0-9,.v-]+$/
  return !stableKeyword && !(version ==~ regex)
}

// before committing a change, make sure task still works
tasks.named('dependencyUpdates', DependencyUpdatesTask).configure { DependencyUpdatesTask dependencyUpdatesTask ->
  ComponentFilter nonStableVersionFilter = { ComponentSelectionWithCurrent selection ->
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion as String)
  }
  dependencyUpdatesTask.rejectVersionIf(nonStableVersionFilter)
}

apply from: './gradle/suppress.gradle'
// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  formats = ['HTML', 'XML']
  suppressionFile = 'config/owasp/suppressions.xml'
  outputDirectory = layout.buildDirectory.dir('reports').get().asFile.absolutePath
}



repositories {
  mavenLocal()
  mavenCentral()
  maven {
    name = "AzureArtifacts"
    url = uri("https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1")
  }
}

application {
  mainClass = 'uk.gov.hmcts.reform.translate.Application'
}

bootJar {
  archiveFileName = "ts-translation-service.jar"

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

// Gradle 7.x issue, workaround from: https://github.com/gradle/gradle/issues/17236#issuecomment-894768083
rootProject.tasks.named("processFunctionalTestResources") {
  duplicatesStrategy = 'include'
}

rootProject.tasks.named("processIntegrationTestResources") {
  duplicatesStrategy = 'include'
}

wrapper {
  distributionType = Wrapper.DistributionType.ALL
}

bootRun {
  mainClass = 'uk.gov.hmcts.reform.translate.Application'
}

bootWithCCD {

  authMode = AuthMode.Local

  environment("RSE_LIB_ADDITIONAL_DATABASES", "ts_translation_service")
  environment("TS_TRANSLATION_SERVICE_DB_USERNAME", "postgres")
  environment("TS_TRANSLATION_SERVICE_DB_PASSWORD", "postgres")
  environment("TS_TRANSLATION_SERVICE_DB_PORT", "6432")
  environment("TS_TRANSLATION_SERVICE_DB_NAME", "ts_translation_service")
  environment("RSE_LIB_S2S_PORT", 4502)
}
