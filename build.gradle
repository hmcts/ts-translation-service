  integrationTestImplementation sourceSets.main.runtimeClasspath
  integrationTestImplementation sourceSets.test.runtimeClasspath
  integrationTestImplementation group: 'com.github.ben-manes.caffeine', name: 'caffeine', version: '3.2.4'
  integrationTestImplementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: jjwt
  integrationTestRuntimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: jjwt
  integrationTestRuntimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: jjwt
  integrationTestImplementation group: 'com.pivovarit', name: 'throwing-function', version: '1.6.1'
  // Vulnerable HttpComponents transitives are excluded below and replaced with 5.6.4/5.4.4.
  //noinspection VulnerableLibrariesLocal
  integrationTestImplementation('org.springframework.cloud:spring-cloud-contract-wiremock:4.3.4') {
    exclude group: 'org.apache.httpcomponents.client5', module: 'httpclient5'
    exclude group: 'org.apache.httpcomponents.core5', module: 'httpcore5'
    exclude group: 'org.apache.httpcomponents.core5', module: 'httpcore5-h2'
  }
  // Vulnerable Commons Compress 1.24.0 is excluded below and replaced with 1.28.0.
  //noinspection VulnerableLibrariesLocal
  integrationTestImplementation("org.testcontainers:postgresql:${testcontainers}") {
    exclude group: 'org.apache.commons', module: 'commons-compress'
  }
  integrationTestImplementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.6.4'
  integrationTestImplementation group: 'org.apache.httpcomponents.core5', name: 'httpcore5', version: '5.4.4'
  integrationTestImplementation group: 'org.apache.httpcomponents.core5', name: 'httpcore5-h2', version: '5.4.4'
  integrationTestImplementation group: 'org.apache.commons', name: 'commons-compress', version: '1.28.0'

  functionalTestImplementation sourceSets.main.runtimeClasspath
  functionalTestImplementation sourceSets.test.runtimeClasspath
  functionalTestImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.5.6'
  functionalTestImplementation group: 'com.github.hmcts', name: 'befta-fw', version: '9.2.7'
  functionalTestImplementation group: 'com.github.hmcts', name: 'ccd-test-definitions', version: '7.25.4'

  cftlibImplementation group: 'org.springframework.boot', name: 'spring-boot-devtools'

}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
  }
}

tasks.named('sonarqube') {
  dependsOn(tasks.named('jacocoTestReport'))
}
tasks.named('check') {
  dependsOn(tasks.named('integration'))
}

sonarqube {
  properties {
    property "sonar.projectName", "Reform :: ts-translation-service"
    property "sonar.projectKey", "uk.gov.hmcts.reform:ts-translation-service"
    property "sonar.coverage.jacoco.xmlReportPaths", "${jacocoTestReport.reports.xml.outputLocation}"
    property "sonar.exclusions",
      "src/main/java/uk/gov/hmcts/reform/translate/Application.java," +
        "src/main/java/uk/gov/hmcts/reform/translate/config/SecurityConfiguration.java"
  }
}

static boolean isNonStable(String version) {
  def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
  def regex = /^[0-9,.v-]+$/
  return !stableKeyword && !(version ==~ regex)
}

// before committing a change, make sure task still works
tasks.named('dependencyUpdates', DependencyUpdatesTask).configure { DependencyUpdatesTask dependencyUpdatesTask ->
  ComponentFilter nonStableVersionFilter = { ComponentSelectionWithCurrent selection ->
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion as String)
  }
  dependencyUpdatesTask.rejectVersionIf(nonStableVersionFilter)
}

apply from: './gradle/suppress.gradle'
// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'
  outputDirectory = layout.buildDirectory.dir('reports').get().asFile.absolutePath
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    name = "AzureArtifacts"
    url = uri("https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1")
  }
}

application {
  mainClass = 'uk.gov.hmcts.reform.translate.Application'
}

bootJar {
  archiveFileName = "ts-translation-service.jar"

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

// Gradle 7.x issue, workaround from: https://github.com/gradle/gradle/issues/17236#issuecomment-894768083
rootProject.tasks.named("processFunctionalTestResources") {
  duplicatesStrategy = 'include'
}

rootProject.tasks.named("processIntegrationTestResources") {
  duplicatesStrategy = 'include'
}

wrapper {
  distributionType = Wrapper.DistributionType.ALL
}

bootRun {
  mainClass = 'uk.gov.hmcts.reform.translate.Application'
}

bootWithCCD {

  authMode = AuthMode.Local

  environment("RSE_LIB_ADDITIONAL_DATABASES", "ts_translation_service")
  environment("TS_TRANSLATION_SERVICE_DB_USERNAME", "postgres")
  environment("TS_TRANSLATION_SERVICE_DB_PASSWORD", "postgres")
  environment("TS_TRANSLATION_SERVICE_DB_PORT", "6432")
  environment("TS_TRANSLATION_SERVICE_DB_NAME", "ts_translation_service")
  environment("RSE_LIB_S2S_PORT", 4502)
}
